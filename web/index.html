<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>listobject coverage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/nord.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="title">
      <strong>listobject.c</strong>
      <span id="score">loading…</span>
    </div>
    <div class="legend">
      <span><i class="swatch out"></i>out of scope</span>
      <span><i class="swatch miss"></i>uncovered</span>
      <span><i class="swatch hit"></i>covered</span>
    </div>
    <div class="actions">
      <label class="toggle" title="Color every gcov line, including ones baselines already hit">
        <input id="ignore-baseline" type="checkbox">
        ignore baselines
      </label>
      <button id="prev" type="button">Prev</button>
      <button id="next" type="button">Next</button>
      <button id="run" type="button">Run</button>
    </div>
  </header>
  <main>
    <section class="pane">
      <textarea id="editor"></textarea>
    </section>
    <section class="pane">
      <textarea id="source"></textarea>
    </section>
  </main>
  <footer>
    <pre id="output"></pre>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
